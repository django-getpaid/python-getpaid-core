[tool.poetry]
name = "getpaid-core"
version = "0.0.0"
description = "Getpaid Core"
authors = ["Dominik Kozaczko <dominik@kozaczko.info>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dekoza/getpaid-core"
repository = "https://github.com/dekoza/getpaid-core"
documentation = "https://getpaid-core.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
]

[tool.poetry.urls]
Changelog = "https://github.com/dekoza/getpaid-core/releases"

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.4.1"
anyio = {version = "^3.6.1", extras = ["trio"]}

[tool.poetry.group.dev.dependencies]
pyupgrade = "^2.32.1"
Pygments = "^2.12.0"
black = "^22.3.0"
darglint = "^1.8.1"
flake8 = "^4.0.1"
flake8-bandit = "^3.0.0"
flake8-bugbear = "^22.4.25"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.2.5"
furo = "^2022.4.7"
isort = "^5.10.1"
mypy = "^0.960"
pep8-naming = "^0.12.1"
pre-commit = "^2.19.0"
pre-commit-hooks = "^4.2.0"
safety = "^1.10.3"
typeguard = "^2.13.3"
xdoctest = {version = "^1.0.0", extras = ["colors"]}

[tool.poetry.group.test.dependencies]
coverage = {version = "^6.4", extras = ["toml"]}
pytest = ">=6.2.5"
nox = "^2022.1.7"
nox-poetry = "^1.0.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^4.3.2"
sphinx-autobuild = "^2021.3.14"
sphinx-click = "^4.1.0"
myst-parser = "^0.17.2"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["getpaid_core", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
